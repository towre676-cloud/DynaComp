name: mathematical regressions
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[numerical]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_examples.py
      - run: python examples/run_adaptive.py
      - run: python applications/network_scenarios/run_demo.py
      - run: python applications/thermal_scenarios/run_demo.py
      - run: python applications/switching_scenarios/run_demo.py
      - run: python examples/thermal_forever.py
      - run: python examples/infinite_spectral.py
      - run: python examples/machine_generating.py
