name: mathematical regressions
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[numerical]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_examples.py
      - run: python examples/run_adaptive.py
      - run: python applications/network_scenarios/run_demo.py
      - run: python applications/thermal_scenarios/run_demo.py
      - run: python applications/switching_scenarios/run_demo.py
      - run: python examples/thermal_forever.py
      - run: python examples/infinite_spectral.py
      - run: python examples/machine_generating.py
      - run: dynacomp-pilot evaluate applications/customer_pilot/two_state.json --output /tmp/pilot --queries 8 --trials 3

  native-portability:
    name: native ${{ matrix.os }} Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install MinGW-w64 GCC (UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' >> $env:GITHUB_PATH
          'DYNACOMP_CC=C:\msys64\ucrt64\bin\gcc.exe' >> $env:GITHUB_ENV
      - run: python -m pip install -e ".[numerical]"
      - name: Require native compilation (no skipped compiler coverage)
        run: python -c "from dynacomp.native import _library; print(_library().compiler_version)"
      - run: python -m unittest discover -s tests -v
      - run: dynacomp-pilot evaluate applications/customer_pilot/two_state.json --output pilot-portability --queries 8 --trials 3
      - run: python tools/check_native_portability.py pilot-portability
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-py311
          path: pilot-portability/

  compare-native-platforms:
    runs-on: ubuntu-24.04
    needs: native-portability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[numerical]"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-py311
          path: portability-results
      - run: python tools/check_native_portability.py --compare portability-results/native-ubuntu-24.04-py311/portability.json portability-results/native-windows-2022-py311/portability.json
