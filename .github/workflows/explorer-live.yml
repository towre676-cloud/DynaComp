name: Refresh the live DynaComp explorer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dynacomp-explorer-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_explorer.py -v
      - run: python scripts/export_explorer.py
      - name: Publish the source-bound live bundle
        run: |
          git config user.name 'DynaComp live publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/explorer_live.json receipts/explorer
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh the live DynaComp workspace'
          git pull --rebase origin main
          git push origin HEAD:main
